name: 问题反馈
description: 反馈可以稳定复现的 WrapPin 问题
title: "[问题] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿上传配对文件、PIN、证书、描述文件、账号凭据或未打码的私人位置。安全问题请通过 Security Advisory 私下报告。
  - type: input
    id: app-version
    attributes:
      label: WrapPin 版本和构建号
      placeholder: 0.9.2-cn.1（Build 54）
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS 版本和 iPhone 型号
    validations:
      required: true
  - type: dropdown
    id: installation-method
    attributes:
      label: 安装方式
      options:
        - SideStore
        - Xcode
        - 其他
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: 当前网络
      options:
        - Wi-Fi
        - 蜂窝网络
        - 与连接无关
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如需填写地点，请尽量使用不涉及隐私的示例位置。
      placeholder: |
        1. 打开……
        2. 轻点……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已删除配对数据、账号凭据和私人位置等敏感信息。
          required: true
